<style>
  :root{
    --coral:#E86457;
    --coral-deep:#A83E33;
    --coral-soft:#F7DAD5;
    --ink:#221D1B;
    --ink-soft:#6B625D;
    --cream:#FAF6F2;
    --card:#FFFFFF;
    --map-blue:#1F4B4D;
    --amber:#B96E12;
    --amber-bg:#FBEDD9;
    --line:#E7DAD1;
    --shadow: 0 1px 2px rgba(34,29,27,.04), 0 6px 18px -10px rgba(34,29,27,.20);
    --radius: 14px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--cream);
    color:var(--ink);
    font-family:'Manrope',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    display:flex;
    flex-direction:column;
  }
  ::selection{background:var(--coral-soft);}
  a{color:inherit;}

  header.bar{
    background:var(--coral);
    color:#fff;
    padding:14px 28px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:20px;
    flex-wrap:wrap;
  }
  .bar-left{display:flex; align-items:center; gap:14px;}
  .bar-logo{width:38px; height:38px; border-radius:10px; flex-shrink:0;}
  .bar-left h1{
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:19px;
    margin:0;
    letter-spacing:-0.01em;
  }
  .bar-left span.sub{
    display:block;
    font-size:12px;
    color:#FFE4DE;
    font-weight:500;
    margin-top:1px;
  }
  .bar-note{
    display:flex;
    align-items:center;
    gap:7px;
    font-size:12px;
    color:#FFEDE9;
    background:rgba(255,255,255,.14);
    border:1px solid rgba(255,255,255,.25);
    padding:6px 12px;
    border-radius:20px;
  }
  .bar-note svg{flex-shrink:0;}

  main{
    flex:1;
    padding:18px 22px;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
    align-items:start;
    max-width:1500px;
    width:100%;
    margin:0 auto;
  }

  .zone{
    background:#F2E9E2;
    border-radius:16px;
    padding:13px 15px;
    display:flex;
    flex-direction:column;
    gap:9px;
  }
  .zone-label{
    display:flex;
    align-items:center;
    gap:8px;
  }
  .zone-count{
    font-family:'JetBrains Mono',monospace;
    font-size:10.5px;
    font-weight:600;
    color:var(--ink-soft);
    background:rgba(255,255,255,.6);
    padding:2px 7px;
    border-radius:10px;
    margin-left:2px;
  }
  .cards-row{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(195px, 1fr));
    gap:10px;
  }
  .zone-dot{width:9px; height:9px; border-radius:50%; flex-shrink:0;}
  .zone-label h2{
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:14.5px;
    margin:0;
    color:var(--ink);
  }

  .card{
    background:var(--card);
    border-radius:var(--radius);
    padding:14px 15px;
    box-shadow:var(--shadow);
    border:1px solid #F0E6DE;
    display:flex;
    flex-direction:column;
    gap:9px;
  }
  .card.muted{
    background:transparent;
    box-shadow:none;
    border:1.5px dashed var(--line);
  }

  .card-top{display:flex; align-items:flex-start; gap:10px;}
  .icon{
    width:34px; height:34px;
    border-radius:9px;
    background:var(--coral-soft);
    color:var(--coral-deep);
    display:flex; align-items:center; justify-content:center;
    flex-shrink:0;
  }
  .card.muted .icon{background:#EEE6DF; color:var(--ink-soft);}

  .card-title{flex:1; min-width:0;}
  .card-title h3{
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:14.5px;
    margin:0 0 4px;
    line-height:1.25;
    color:var(--ink);
  }
  .card.muted h3{color:var(--ink-soft);}

  .badges{display:flex; flex-wrap:wrap; gap:5px;}
  .badge{
    font-family:'JetBrains Mono',monospace;
    font-size:9.5px;
    font-weight:600;
    letter-spacing:.02em;
    padding:3px 7px;
    border-radius:20px;
    white-space:nowrap;
  }
  .badge.platform{background:#F0EAE5; color:var(--ink-soft);}
  .badge.lock{background:var(--amber-bg); color:var(--amber); display:flex; align-items:center; gap:3px;}
  .badge.soon{background:#EEE9E4; color:var(--ink-soft);}

  .actions{display:flex; flex-wrap:wrap; gap:6px;}
  .btn-open{
    display:inline-flex;
    align-items:center;
    gap:5px;
    background:var(--ink);
    color:#fff;
    text-decoration:none;
    font-weight:700;
    font-size:12px;
    padding:7px 11px;
    border-radius:8px;
    transition:background .15s ease, transform .15s ease;
  }
  .btn-open:hover{background:var(--coral-deep); transform:translateY(-1px);}
  .btn-open.disabled{
    background:transparent; color:var(--ink-soft);
    border:1.5px dashed var(--line);
    cursor:default; pointer-events:none;
  }
  .btn-cred{
    display:inline-flex; align-items:center; gap:5px;
    background:transparent;
    border:1.5px solid var(--line);
    color:var(--ink-soft);
    font-weight:600; font-size:12px;
    padding:6.5px 10px;
    border-radius:8px;
    cursor:pointer;
    font-family:inherit;
    transition:border-color .15s ease, color .15s ease;
  }
  .btn-cred:hover{border-color:var(--coral); color:var(--coral-deep);}

  .cred-panel{margin-top:2px; padding-top:10px; border-top:1px dashed var(--line);}
  .cred-panel[hidden]{display:none;}
  .field{display:flex; flex-direction:column; gap:4px; margin-bottom:8px;}
  .field label{font-size:10px; font-weight:700; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.03em;}
  .field-row{display:flex; gap:5px;}
  .field input{
    flex:1; font-family:inherit; font-size:13px;
    padding:6.5px 9px; border-radius:7px;
    border:1.5px solid var(--line); background:#FBFAF8; color:var(--ink);
  }
  .field input:focus{outline:2px solid var(--coral); outline-offset:1px; border-color:var(--coral);}
  .eye{border:1.5px solid var(--line); background:#fff; border-radius:7px; width:34px; cursor:pointer; font-size:13px; color:var(--ink-soft);}
  .cred-actions{display:flex; gap:6px; margin-top:8px;}
  .cred-actions button{font-family:inherit; font-weight:700; font-size:11px; padding:6.5px 10px; border-radius:7px; cursor:pointer;}
  .save-btn{background:var(--coral); border:none; color:#fff;}
  .save-btn:hover{background:var(--coral-deep);}
  .clear-btn{background:transparent; border:1.5px solid var(--line); color:var(--ink-soft);}
  .clear-btn:hover{border-color:#C9463A; color:#C9463A;}
  .cred-status{font-size:11px; color:var(--map-blue); font-weight:600; margin-top:6px; min-height:13px;}
  .cred-warning{font-size:10px; color:var(--ink-soft); margin-top:8px; line-height:1.45;}

  .slack-block{
    display:flex; flex-direction:column; gap:5px;
    margin-top:2px; padding-top:9px;
    border-top:1px dashed var(--line);
  }
  .slack-row{
    display:flex; align-items:center; gap:6px;
    font-size:11px; color:var(--ink-soft);
  }
  .slack-row svg{flex-shrink:0; color:#6B5B95;}
  .slack-handle{
    font-family:'JetBrains Mono',monospace;
    font-weight:600;
    font-size:10.5px;
    color:#5B4B8A;
    background:#EFEAF6;
    padding:1.5px 6px;
    border-radius:10px;
  }

  .direct-url{
    display:flex; align-items:center; gap:6px;
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    color:var(--map-blue);
    text-decoration:none;
    background:#EAF1F0;
    padding:5px 9px;
    border-radius:8px;
    width:fit-content;
    max-width:100%;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .direct-url:hover{background:#DCEAE8;}

  footer{
    text-align:center;
    color:var(--ink-soft);
    font-size:11.5px;
    padding:0 20px 16px;
  }

  @media (max-width: 900px){
    main{grid-template-columns:1fr;}
  }
  @media (max-width: 620px){
    main{padding:14px; gap:12px;}
    .cards-row{grid-template-columns:1fr;}
    header.bar{padding:14px 16px;}
    .bar-note{display:none;}
  }
</style>
</head>

};
const LOCK_SVG = '<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>';
const SLACK_SVG = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 3l6 6"/><path d="M8 3l7 7-7 7-4-4z"/><circle cx="17.5" cy="17.5" r="2.5"/></svg>';
const LINK_SVG = '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1 1"/><path d="M14 11a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1-1"/></svg>';

function slugify(str){
  return str.toLowerCase()
    .normalize("NFD").replace(/[\u0300-\u036f]/g,"")
    .replace(/[^a-z0-9]+/g,"-").replace(/(^-|-$)/g,"");
}
function storageKey(slug){ return "playgoxp_cred_" + slug; }

function renderCard(tool){
  const slug = slugify(tool.name);
  const isComingSoon = !tool.url;

  let badges = `<span class="badge platform">${tool.platform}</span>`;
  if(tool.protected) badges += `<span class="badge lock">${LOCK_SVG} Protegido</span>`;
  if(isComingSoon) badges += `<span class="badge soon">Próximamente</span>`;

  const openBtn = isComingSoon
    ? `<span class="btn-open disabled">Sin enlace</span>`
    : `<a class="btn-open" href="${tool.url}" target="_blank" rel="noopener">Abrir ↗</a>`;

  const credBtn = tool.protected
    ? `<button class="btn-cred" data-target="cred-${slug}">Acceso</button>` : "";

  const credPanel = tool.protected ? `
    <div class="cred-panel" id="cred-${slug}" hidden>
      <div class="field">
        <label>Usuario</label>
        <input type="text" class="cred-user" data-slug="${slug}" placeholder="usuario" value="${tool.defaultUser || ""}">
      </div>
      <div class="field">
        <label>Contraseña</label>
        <div class="field-row">
          <input type="password" class="cred-pass" data-slug="${slug}" placeholder="contraseña">
          <button type="button" class="eye" data-slug="${slug}">👁</button>
        </div>
      </div>
      <div class="cred-actions">
        <button type="button" class="save-btn" data-slug="${slug}">Guardar</button>
        <button type="button" class="clear-btn" data-slug="${slug}">Borrar</button>
      </div>
      <div class="cred-status" data-slug="${slug}"></div>
      <p class="cred-warning">Guardado local sin cifrar en este navegador.</p>
    </div>` : "";

  const slackBlock = (tool.slack && tool.slack.length) ? `
    <div class="slack-block">
      ${tool.slack.map(s => `
        <div class="slack-row">${SLACK_SVG} ${s.label}: <span class="slack-handle">${s.handle}</span></div>
      `).join("")}
    </div>` : "";

  const urlLine = (tool.showUrl && tool.url) ? `
    <a class="direct-url" href="${tool.url}" target="_blank" rel="noopener">${LINK_SVG} ${tool.url.replace(/^https?:\/\//,"")}</a>` : "";

  return `
    <div class="card ${isComingSoon ? "muted" : ""}">
      <div class="card-top">
        <div class="icon">${ICONS[tool.icon] || ""}</div>
        <div class="card-title">
          <h3>${tool.name}</h3>
          <div class="badges">${badges}</div>
        </div>
      </div>
      <div class="actions">${openBtn}${credBtn}</div>
      ${urlLine}
      ${credPanel}
      ${slackBlock}
    </div>`;
}

function render(){
  const board = document.getElementById("board");
  board.innerHTML = DATA.map(zone => `
    <section class="zone">
      <div class="zone-label">
        <span class="zone-dot" style="background:${zone.color}"></span>
        <h2>${zone.zone}</h2>
        <span class="zone-count">${zone.tools.length}</span>
      </div>
      <div class="cards-row">${zone.tools.map(renderCard).join("")}</div>
    </section>
  `).join("");
  attachHandlers();
}

function attachHandlers(){
  document.querySelectorAll(".btn-cred").forEach(btn => {
    btn.addEventListener("click", () => {
      const panel = document.getElementById(btn.dataset.target);
      panel.hidden = !panel.hidden;
      if(!panel.hidden){
        loadCreds(btn.dataset.target.replace("cred-",""));
      }
    });
  });
  document.querySelectorAll(".eye").forEach(btn => {
    btn.addEventListener("click", () => {
      const input = document.querySelector(`.cred-pass[data-slug="${btn.dataset.slug}"]`);
      input.type = input.type === "password" ? "text" : "password";
    });
  });
  document.querySelectorAll(".save-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      const slug = btn.dataset.slug;
      const user = document.querySelector(`.cred-user[data-slug="${slug}"]`).value;
      const pass = document.querySelector(`.cred-pass[data-slug="${slug}"]`).value;
      try{
        localStorage.setItem(storageKey(slug), JSON.stringify({user, pass}));
        setStatus(slug, "Guardado ✓");
      }catch(e){
        setStatus(slug, "No se pudo guardar");
      }
    });
  });
  document.querySelectorAll(".clear-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      const slug = btn.dataset.slug;
      localStorage.removeItem(storageKey(slug));
      document.querySelector(`.cred-pass[data-slug="${slug}"]`).value = "";
      const userInput = document.querySelector(`.cred-user[data-slug="${slug}"]`);
      userInput.value = userInput.defaultValue || "";
      setStatus(slug, "Borrado");
    });
  });
}

function loadCreds(slug){
  try{
    const raw = localStorage.getItem(storageKey(slug));
    if(!raw) return;
    const {user, pass} = JSON.parse(raw);
    const userInput = document.querySelector(`.cred-user[data-slug="${slug}"]`);
    const passInput = document.querySelector(`.cred-pass[data-slug="${slug}"]`);
    if(user) userInput.value = user;
    if(pass) passInput.value = pass;
  }catch(e){ /* ignore corrupted entry */ }
}

function setStatus(slug, msg){
  const el = document.querySelector(`.cred-status[data-slug="${slug}"]`);
  if(el){
    el.textContent = msg;
    setTimeout(() => { if(el.textContent === msg) el.textContent = ""; }, 2200);
  }
}

render();
</script>
