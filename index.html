<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Herramientas · Play&amp;go</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    :root { --coral: #e86457; --coral-oscuro: #c24a3e; --tinta: #1f1a17; --suave: #5f5652; --fondo: #f6f4f2; --borde: #ece6e2; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; font-family: 'Inter', system-ui, sans-serif; background: var(--fondo); color: var(--tinta); }
    main { width: 100%; max-width: 520px; background: #fff; border: 1px solid var(--borde); border-radius: 16px; padding: 32px 28px; box-shadow: 0 2px 10px rgba(32, 26, 24, .06); }
    .marca { display: inline-flex; align-items: center; justify-content: center; width: 48px; height: 48px; border-radius: 12px; background: var(--coral); color: #fff; font-weight: 700; font-size: 15px; margin-bottom: 18px; }
    h1 { font-size: 1.4rem; margin: 0 0 10px; }
    p { line-height: 1.55; color: var(--suave); margin: 0 0 16px; }
    .boton { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px 18px; border-radius: 12px; border: 1px solid var(--borde); text-decoration: none; color: var(--tinta); margin-top: 8px; transition: border-color .15s, box-shadow .15s; }
    .boton:hover, .boton:focus-visible { border-color: var(--coral); box-shadow: 0 4px 14px rgba(32, 26, 24, .08); outline: none; }
    .boton strong { display: block; font-size: 1rem; }
    .boton span span { font-size: .88rem; color: var(--suave); }
    .flecha { color: var(--coral-oscuro); font-size: 1.3rem; }
    .nota { font-size: .85rem; margin: 22px 0 0; }
  </style>
</head>
<body>
  <main>
    <div class="marca" aria-hidden="true">P&amp;G</div>
    <h1>Las herramientas se han trasladado</h1>
    <p>Las herramientas internas de Play&amp;go se están unificando en el nuevo Sistema P&amp;G. Mientras tanto, las horas se siguen apuntando como siempre:</p>
    <a class="boton" href="https://playgo-proyectos.web.app/">
      <span><strong>Control de proyectos</strong><span>Apuntar horas</span></span>
      <span class="flecha" aria-hidden="true">→</span>
    </a>
    <p class="nota">Para cualquier otra herramienta, pregunta a Gersón.</p>
  </main>
</body>
</html>
